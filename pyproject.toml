[tool.poetry]
packages = [{include = "XBrainLab"}]
requires-poetry = ">=2.3,<3"

[project]
# Poetry 2.3+ uses this root extra to select the mutually exclusive Windows
# CUDA wheels below. PEP 621 owns install metadata; tool.poetry only enriches
# the three PyTorch dependencies with explicit source selection.
name = "xbrainlab"
version = "0.8.0"
description = "XBrainLab: EEG Analysis Platform with AI Agent"
authors = [{ name = "XBrainLab Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy (>=2.0,<3)",
    "scipy (>=1.10.0,<2.0.0)",
    "matplotlib (>=3.8.0,<4.0.0)",
    "scikit-learn (>=1.4.0,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "h5py (>=3.10.0,<4.0.0)",
    "mne (>=1.6.0,<2.0.0)",
    "pymatreader (>=1.2.2,<2)",
    "braindecode (==1.6.1)",
    "torch (==2.11.0)",
    "torchvision (==0.26.0)",
    "torchaudio (==2.11.0)",
    "captum (>=0.7.0,<0.8.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "pyyaml (>=6.0,<7.0)",
    "psutil (>=5.9.0,<6.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "typing-extensions (>=4.6.0)",
    "torchinfo (>=1.8.0,<2.0.0)",
    "pyqt6 (>=6.10.2,<7.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)",
    "qdarkstyle (>=3.2,<4.0)",
    "vtk (==9.3.1)",
    "pyvista (>=0.43.0,<0.45.0)",
    "pyvistaqt (>=0.11.0,<0.12.0)",
    "langchain-core (==1.3.3)",
    "langchain-huggingface (==1.1.0)",
    "langchain-qdrant (==1.1.0)",
    "qdrant-client (>=1.9.0,<2.0.0)",
    "sentence-transformers (>=2.6,<3)",
]

[project.optional-dependencies]
cpu = [
    "torch (==2.11.0+cpu) ; sys_platform == 'win32'",
    "torchvision (==0.26.0+cpu) ; sys_platform == 'win32'",
    "torchaudio (==2.11.0+cpu) ; sys_platform == 'win32'",
]
cuda = [
    "torch (==2.11.0+cu130) ; sys_platform == 'win32'",
    "torchvision (==0.26.0+cu130) ; sys_platform == 'win32'",
    "torchaudio (==2.11.0+cu130) ; sys_platform == 'win32'",
]

[project.scripts]
test-backend = "scripts.dev.run_tests:backend"
test-ui = "scripts.dev.run_tests:ui"
test-llm = "scripts.dev.run_tests:run_llm_tests"
test-remote = "scripts.dev.run_tests:run_remote_tests"

[tool.poetry.dependencies]
# Explicit sources enrich the matching PEP 621 dependencies above. The three
# markers are mutually exclusive for every supported target.
torch = [
    { markers = "sys_platform != 'win32'" },
    { markers = "sys_platform == 'win32' and extra == 'cpu' and extra != 'cuda'", source = "pytorch-cpu" },
    { markers = "sys_platform == 'win32' and extra == 'cuda' and extra != 'cpu'", source = "pytorch-cu130" },
]
torchvision = [
    { markers = "sys_platform != 'win32'" },
    { markers = "sys_platform == 'win32' and extra == 'cpu' and extra != 'cuda'", source = "pytorch-cpu" },
    { markers = "sys_platform == 'win32' and extra == 'cuda' and extra != 'cpu'", source = "pytorch-cu130" },
]
torchaudio = [
    { markers = "sys_platform != 'win32'" },
    { markers = "sys_platform == 'win32' and extra == 'cpu' and extra != 'cuda'", source = "pytorch-cpu" },
    { markers = "sys_platform == 'win32' and extra == 'cuda' and extra != 'cpu'", source = "pytorch-cu130" },
]

[tool.poetry.group.legacy-remote-llm]
optional = true

[tool.poetry.group.legacy-remote-llm.dependencies]
openai = "^2.15.0"
google-genai = "^1.59.0"

[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
transformers = "^4.30.0"
accelerate = "^1.12.0"
bitsandbytes = "^0.49.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
pre-commit = "^3.6.0"
poethepoet = "^0.40.0"
mypy = "^1.19.1"
types-requests = "^2.32.4.20260107"
types-pyyaml = "^6.0.12.20250915"
commitizen = "^4.11.6"
basedpyright = "^1.39.2"
pillow = "12.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-qt = "^4.2.0"
coverage = "^7.0"
pytest-forked = "^1.6.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.0"
mkdocstrings = "^0.29.0"
mkdocstrings-python = "^1.16.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Tool Configurations ---

[tool.ruff]
# Top level options (optional)
exclude = [
    "XBrainLab/llm/core/models",
]

[tool.ruff.lint]
ignore = [
    "PLR09",
    "PLR2004",
    "N999"  # Ignore module naming for XBrainLab
]
select = [
    "F",
    "W",
    "E",
    "I",
    "A",
    "B",
    "C4",
    "SIM",
    "UP",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "RUF",
    "TRY3",
    "S",
    "N",
]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402", "PLC0415"]
"scripts/**/*.py" = ["E402", "E501", "SIM102", "N806", "C414", "PERF", "PLR5501", "E722", "PLC0415"]
"tests/**/*.py" = ["E402", "S101", "N", "E501", "F841", "PLC0415", "S108"]
"XBrainLab/backend/dataset/dataset_generator.py" = ["PLC0415"]
"XBrainLab/backend/load_data/data_loader.py" = ["PLC0415"]
"XBrainLab/backend/training/training_plan.py" = ["PLC0415"]
"XBrainLab/llm/rag/retriever.py" = ["PLC0415"]
"XBrainLab/llm/core/backends/local.py" = ["PLC0415"]
"XBrainLab/llm/core/engine.py" = ["PLC0415"]
"XBrainLab/ui/dialogs/model_settings_dialog.py" = ["PLC0415"]
"XBrainLab/llm/core/config.py" = ["PLC0415"]
"XBrainLab/llm/tools/__init__.py" = ["PLC0415", "PLW0603"]


[tool.ruff.lint.pep8-naming]
ignore-names = ["X", "Y", "x", "y", "Pxx"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
exclude = [
    "tests",
    "XBrainLab/llm/core/models",
    "XBrainLab/llm/rag",
    "scripts"
]

[tool.basedpyright]
include = ["XBrainLab"]
exclude = [
    "XBrainLab/llm/core/models",
    "XBrainLab/backend/model_base/legacy_braindecode",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v --capture=sys"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = ["XBrainLab", ".git", "__pycache__", "*.egg-info"]
markers = [
    "timeout: Mark test with a timeout.",
    "platform_contract: Test validates an explicit OS-specific contract.",
    "optional_public_fixture: Test requires downloaded public fixture data owned by a dedicated gate.",
]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore:The class.*was deprecated:DeprecationWarning",
    "ignore:`recreate_collection` method is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["XBrainLab"]
omit = [
    "**/torch/*",
    "**/torchvision/*",
    "**/torchaudio/*",
    "**/captum/*",
    "**/pyvista/*",
    "**/pyvistaqt/*",
    "**/vtk*",
    "**/mne/*",
    "*/.virtualenvs/*",
    "*/site-packages/*",
    "tests/*",
    "XBrainLab/llm/core/models/*",
    "XBrainLab/backend/visualization/saliency_3d_engine.py",
    "XBrainLab/ui/panels/visualization/saliency_views/plot_3d_head.py",
    "XBrainLab/ui/panels/visualization/saliency_views/plot_3d_view.py",
]
concurrency = ["multiprocessing"]

[tool.coverage.report]
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.poe.tasks]
# Development
verify = "python scripts/dev/verify_real_tools.py"
run = "python run.py"
quality-dashboard = "python scripts/dev/update_quality_dashboard.py"
quality-dashboard-full = "python scripts/dev/update_quality_dashboard.py --include-slow-checks"

# Testing
test-unit = "python scripts/dev/run_tests.py unit"
test-integration = "python scripts/dev/run_tests.py integration"
test-backend = "pytest tests/unit/backend tests/integration -v"
test-ui = "pytest tests/unit/ui -v"
test-llm = "pytest tests/unit/llm -v"
test-real = "pytest tests/unit/llm/tools/real"
test-all = "python scripts/dev/run_tests.py all"
test-cov = "pytest --cov=XBrainLab --cov-report=html --cov-report=term-missing"

# Code Quality
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
typecheck-fast = "python scripts/dev/run_basedpyright_regression.py"
mypy = "mypy XBrainLab/"
mypy-daemon = "dmypy run -- --config-file pyproject.toml XBrainLab/"
check-architecture = "python tests/architecture_compliance.py"
check = ["lint", "typecheck-fast", "test-unit", "check-architecture"]
check-full = ["lint", "typecheck-fast", "mypy", "test-unit", "check-architecture"]

# Utilities
clean = { cmd = "rm -rf output __pycache__ .pytest_cache .ruff_cache .mypy_cache htmlcov .coverage", help = "Remove temporary files" }
pre-commit-run = "pre-commit run --all-files"

# Changelog (自動化)
changelog = "cz changelog"
bump = "cz bump"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "XBrainLab/config.py:VERSION",
    "XBrainLab/__init__.py:FALLBACK_VERSION",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
