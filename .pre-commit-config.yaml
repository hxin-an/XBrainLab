repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/python-poetry/poetry
    rev: 2.2.1
    hooks:
      - id: poetry-check

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # These generated contracts contain only public source revisions and
        # dataset checksums. Python fixtures remain subject to line-level review.
        exclude: >-
          package-lock\.json|artifacts/user-journeys/moabb-datasets-v1\.json|user_docs/assets/manifests/moabb-datasets-v1\.json|user_docs/case-studies/manifests/moabb-(lee2021mobile-erp|ofner2017|physionetmi)\.yml
