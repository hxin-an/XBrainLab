version: 1
cases:
  - id: a-root-01
    prompt: "Identify the canonical repository layer that owns branch, dirty-worktree, authorization, and destructive-action rules before a coding task starts."
    expected_authority_class: root_invariants
  - id: a-root-02
    prompt: "A request is generic and requires no XBrainLab repository work. Identify the repository layer that establishes that no-repo-work and authorization boundary."
    expected_authority_class: root_invariants

  - id: a-current-01
    prompt: "Identify the canonical repository layer that owns what XBrainLab can currently claim, its active priority, and what remains incomplete."
    expected_authority_class: current_truth
  - id: a-current-02
    prompt: "Identify the canonical repository layer for the currently selected product model and whether a retained subsystem is on the active roadmap."
    expected_authority_class: current_truth

  - id: a-architecture-01
    prompt: "Identify the canonical repository layer for desired ApplicationService and Command API ownership that is a target requirement rather than a completion claim."
    expected_authority_class: target_architecture
  - id: a-architecture-02
    prompt: "Identify the canonical repository layer for comparing current implementation boundaries with the intended UI, backend, and Assistant architecture."
    expected_authority_class: target_architecture

  - id: a-validation-01
    prompt: "Identify the canonical repository layer that owns executable handoff gate IDs, their argv, and exact-SHA evidence requirements."
    expected_authority_class: validation_registry
  - id: a-validation-02
    prompt: "Identify the canonical repository layer that decides which validation result can support a checkpoint, handoff, or completion claim."
    expected_authority_class: validation_registry

  - id: a-skill-01
    prompt: "Identify the canonical repository layer that decides whether the UI product review capability triggers and defines that specialist review method."
    expected_authority_class: skill_trigger
  - id: a-skill-02
    prompt: "Identify the canonical repository layer that defines the trigger and specialist method for EEG data-interpretation review."
    expected_authority_class: skill_trigger

  - id: a-workflow-01
    prompt: "Identify the canonical repository layer that owns the reusable multi-step procedure for slicing a bounded refactor with rollback and validation."
    expected_authority_class: workflow
  - id: a-workflow-02
    prompt: "Identify the canonical repository layer that owns the reusable handoff-candidate sequence after implementation and focused validation."
    expected_authority_class: workflow

  - id: a-history-01
    prompt: "Identify the canonical repository layer for a dated audit retained only to explain past work, not to dispatch the active queue."
    expected_authority_class: historical_provenance
  - id: a-history-02
    prompt: "Identify the canonical repository layer used to recover why a superseded decision was made without treating it as current product truth."
    expected_authority_class: historical_provenance
